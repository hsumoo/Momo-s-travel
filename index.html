<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momo 的旅遊規劃首頁">
  <title>Momo 的旅行計畫</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="label">MOMO'S TRAVEL</p>

    <section class="trip-list" aria-label="旅行計畫列表">
      <a class="trip" href="https://hsumoo.github.io/jeju-trip/" target="_blank" rel="noopener noreferrer">

      <a class="trip" href="https://hsumoo.github.io/Busan-trip/" target="_blank" rel="noopener noreferrer">
        <span class="date">2026.12</span>

      </a>
      <a class="trip" href="https://hsumoo.github.io/Hiroshima-trip/" target="_blank" rel="noopener noreferrer">
        <span class="date">2027.02</span>
        <span class="destination">廣島</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
  <footer>© Momo's Travel</footer>
</body>
</html>
