<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momo 的旅行紀錄與行程規劃">
  <title>Momo's Travel｜旅行紀錄</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F8DF8B'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='38'%3E%F0%9F%A7%B3%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --navy: #9a7a55;
      --blue: #b1843f;
      --paper: #fff9e8;
      --white: #fff;
      --ink: #4d3d29;
      --muted: #8a765b;
      --line: #ead9b4;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .topbar {
      height: 64px;
      padding: 0 clamp(20px, 5vw, 68px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: var(--navy);
    }

    .logo { font-family: Georgia, serif; font-size: 1.1rem; font-weight: bold; }
    .topbar span:last-child { color: rgba(255,255,255,.7); font-size: .85rem; }

    main {
      width: min(1050px, calc(100% - 40px));
      margin: auto;
      padding: 72px 0 100px;
    }

    .intro { margin-bottom: 72px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0 0 18px;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .intro > p:last-child {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 11px;
      left: 8%;
      right: 8%;
      height: 1px;
      background: var(--line);
    }

    .year { position: relative; }
    .year-heading { margin-bottom: 25px; text-align: center; }
    .dot {
      width: 23px;
      height: 23px;
      margin: 0 auto 13px;
      display: block;
      border: 7px solid var(--paper);
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
    }

    h2 { margin: 0; color: var(--navy); font-family: Georgia, serif; font-size: 1.8rem; }
    .trip-list { display: grid; gap: 12px; }

    .trip {
      min-height: 112px;
      padding: 21px;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 14px;
      align-items: center;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.76);
    }

    a.trip { transition: transform .18s ease, box-shadow .18s ease; }
    a.trip:hover, a.trip:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(121,91,51,.12);
      outline: 2px solid #e1bb65;
      outline-offset: 1px;
    }

    .month { align-self: start; padding-top: 3px; color: var(--blue); font-size: .86rem; font-weight: 700; }
    h3 { margin: 0 0 5px; font-size: 1.25rem; }
    .english { margin: 0; color: var(--muted); font-size: .72rem; letter-spacing: .1em; }
    .status { grid-column: 2; color: var(--muted); font-size: .78rem; }
    a .status { color: var(--blue); font-weight: 650; }
    .planning { border-style: dashed; background: transparent; }
    .planning .status {
      width: fit-content;
      padding: 4px 9px;
      color: #76551c;
      border-radius: 20px;
      background: #f8df8b;
    }

    footer {
      padding: 27px 20px;
      color: rgba(255,255,255,.65);
      background: var(--navy);
      text-align: center;
      font-size: .78rem;
    }

    @media (max-width: 760px) {
      main { padding-top: 52px; }
      .intro { margin-bottom: 56px; }
      .timeline { display: block; padding-left: 31px; }
      .timeline::before { top: 0; bottom: 0; left: 8px; width: 1px; height: auto; }
      .year { margin-bottom: 46px; }
      .year:last-child { margin-bottom: 0; }
      .year-heading { position: relative; text-align: left; }
      .dot { position: absolute; top: 5px; left: -35px; margin: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="logo">Momo's Travel</span>
    <span>2025 — 2027</span>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">TRAVEL ARCHIVE</p>
      <p>所有旅行紀錄與正在規劃的行程，按照年份收在這裡。</p>
    </section>

    <section class="timeline" aria-label="2025 至 2027 年旅行時間線">
      <article class="year">
        <div class="year-heading"><span class="dot"></span><h2>2025</h2></div>
        <div class="trip-list">
          <div class="trip">
            <div class="month">12月</div>
            <div><h3>🇰🇷 濟州島</h3><p class="english">JEJU ISLAND</p></div>
            <span class="status">已完成</span>
          </div>
        </div>
      </article>

      <article class="year">
        <div class="year-heading"><span class="dot"></span><h2>2026</h2></div>
        <div class="trip-list">
          <div class="trip">
            <div class="month">06月</div>
            <div><h3>🇯🇵 🛳️ 沖繩郵輪</h3><p class="english">OKINAWA CRUISE</p></div>
            <span class="status">已完成</span>
          </div>

          <a class="trip" href="https://hsumoo.github.io/okayama-trip/" target="_blank" rel="noopener noreferrer">
            <div class="month">08月</div>
            <div><h3>🇯🇵 岡山</h3><p class="english">OKAYAMA</p></div>
            <span class="status">查看行程 ↗</span>
          </a>

          <a class="trip" href="https://hsumoo.github.io/Busan-trip/" target="_blank" rel="noopener noreferrer">
            <div class="month">12月</div>
            <div><h3>🇰🇷 釜山</h3><p class="english">BUSAN</p></div>
            <span class="status">查看行程 ↗</span>
          </a>
        </div>
      </article>

      <article class="year">
        <div class="year-heading"><span class="dot"></span><h2>2027</h2></div>
        <div class="trip-list">
          <a class="trip" href="https://hsumoo.github.io/Hiroshima-trip/" target="_blank" rel="noopener noreferrer">
            <div class="month">02月</div>
            <div><h3>🇯🇵 廣島</h3><p class="english">HIROSHIMA</p></div>
            <span class="status">查看行程 ↗</span>
          </a>

          <div class="trip planning">
            <div class="month">08月</div>
            <div><h3>🇯🇵 青森</h3><p class="english">AOMORI</p></div>
            <span class="status">規劃中</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer>© Momo's Travel</footer>
</body>
</html>
