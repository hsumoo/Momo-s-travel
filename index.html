<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Momo 的個人旅遊規劃首頁，整理岡山、釜山與廣島行程。">
  <meta name="theme-color" content="#123253">
  <title>Momo's Travel Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123253'/%3E%3Cpath d='M17 42 31 17l5 16 11-5-14 19-4-13-12 8Z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="回到首頁">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>Momo's Travel Notes</span>
    </a>
    <a class="year-link" href="#trips">My trips <span aria-hidden="true">↓</span></a>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero-image" src="assets/travel-journal.png" alt="地圖、相機與旅行手帳組成的旅行規劃桌面">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="eyebrow">MOMO'S JOURNEY ARCHIVE</p>
        <h1 id="hero-title">把每一次出發，<br><em>收進旅行筆記裡。</em></h1>
        <p class="hero-copy">行程、交通與沿途想去的地方，都從這裡開始。</p>
      </div>
    </section>

    <section class="trips" id="trips" aria-labelledby="trips-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow dark">TRAVEL PLANS</p>
          <h2 id="trips-title">旅行計畫</h2>
        </div>
        <p class="trip-count">03 trips</p>
      </div>

      <div class="trip-grid">
        <a class="trip-card okayama" href="https://hsumoo.github.io/jeju-trip/" target="_blank" rel="noopener noreferrer" aria-label="開啟 2026 年 8 月岡山旅行規劃">
          <div class="card-number">01</div>
          <div class="card-body">
            <p class="date">2026.08</p>
            <h3>岡山</h3>
            <p class="place-en">OKAYAMA, JAPAN</p>
          </div>
          <span class="card-arrow" aria-hidden="true">↗</span>
        </a>

        <a class="trip-card busan" href="https://hsumoo.github.io/Busan-trip/" target="_blank" rel="noopener noreferrer" aria-label="開啟 2026 年 12 月釜山旅行規劃">
          <div class="card-number">02</div>
          <div class="card-body">
            <p class="date">2026.12</p>
            <h3>釜山</h3>
            <p class="place-en">BUSAN, KOREA</p>
          </div>
          <span class="card-arrow" aria-hidden="true">↗</span>
        </a>

        <a class="trip-card hiroshima" href="https://hsumoo.github.io/Hiroshima-trip/" target="_blank" rel="noopener noreferrer" aria-label="開啟 2027 年 2 月廣島旅行規劃">
          <div class="card-number">03</div>
          <div class="card-body">
            <p class="date">2027.02</p>
            <h3>廣島</h3>
            <p class="place-en">HIROSHIMA, JAPAN</p>
          </div>
          <span class="card-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>Momo's Travel Notes</p>
    <p>Keep exploring, keep remembering.</p>
  </footer>
</body>
</html>
